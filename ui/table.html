<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Microsoft YaHei', sans-serif; background: #fff; }
  #question-table { height: 100vh; width: 100%; font-size: 14px; }
  .tabulator { background: #fff; }
  .tabulator-row.tabulator-selected { background-color: #D2E3FC !important; }
  .tabulator-cell { white-space: normal !important; word-wrap: break-word !important; }
  .star-btn { cursor: pointer; font-size: 18px; border: none; background: none; padding: 2px 6px; border-radius: 50%; }
  .star-btn.on { color: #F5A623; }
  .star-btn.off { color: #BBB; }
  .tag-chip { display: inline-block; color: #fff; border-radius: 10px; padding: 2px 10px; font-size: 12px; font-weight: bold; margin: 1px 2px; cursor: pointer; }
  .ans-btn { background: #D0D0D0; color: #666; border: none; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .op-edit { background: #E8E8E8; color: #333; border: 1px solid #CCC; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px; margin-right: 4px; }
  .op-del { background: #FFE8E8; color: #C00; border: 1px solid #FFB0B0; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .answer-img { max-width: 100%; }
</style>
</head>
<body>
<div id="question-table"></div>

<!-- Tabulator from local copy or CDN -->
<script>
// If online, load from CDN; otherwise use local fallback
var TABULATOR_LOADED = false;
function initTable() {
  if (TABULATOR_LOADED) return;
  TABULATOR_LOADED = true;

  var columns = [
    { title: "序号", field: "idx", width: 70, hozAlign: "center", headerSort: false },
    { title: "初始编号", field: "uid", width: 140, hozAlign: "center", visible: false },
    { title: "星标", field: "starred", width: 55, hozAlign: "center",
      formatter: function(cell) {
        var v = cell.getValue(); var cls = v ? 'on' : 'off';
        return '<span class="star-btn ' + cls + '" data-qid="'
               + cell.getRow().getData().id + '">' + (v ? '★' : '☆') + '</span>';
      }
    },
    { title: "题目", field: "question", width: 500,
      formatter: function(cell) {
        var d = cell.getRow().getData();
        var h = '';
        if (d.q_img && d.q_img !== '') {
          h += '<img src="file:///' + d.q_img.replace(/\\/g,'/')
               + '" style="max-width:100%;max-height:' + (d.img_mode==='full'?'none':'50px') + ';"><br>';
        }
        h += '<span>' + (d.question||'') + '</span>'; return h;
      }
    },
    { title: "分类", field: "cat", width: 100 },
    { title: "标签", field: "tags", width: 200,
      formatter: function(cell) {
        var tags = cell.getValue() || [];
        return tags.map(function(t) {
          return '<span class="tag-chip" style="background:' + t.color
                 + '" data-tag-id="' + t.id + '">' + t.name + '</span>';
        }).join('');
      }
    },
    { title: "答案", field: "answer", width: 200,
      formatter: function(cell) {
        var d = cell.getRow().getData();
        if (d.ans_expanded) {
          var h = '';
          if (d.a_img && d.a_img !== '') h += '<img src="file:///' + d.a_img.replace(/\\/g,'/') + '" class="answer-img"><br>';
          h += '<span>' + (d.answer||'') + '</span>';
          h += '<br><button class="ans-btn ans-collapse" data-qid="' + d.id + '">收起答案</button>';
          return h;
        }
        return '<button class="ans-btn ans-expand" data-qid="' + d.id + '">点击查看答案</button>';
      }
    },
    { title: "备注", field: "notes", width: 120, visible: false },
    { title: "错次", field: "wrong_count", width: 60, hozAlign: "center",
      formatter: function(cell) {
        var v = cell.getValue()||0; return v>0?'<span style="color:red">'+v+'</span>':'0';
      }
    },
    { title: "最近修改", field: "updated_at", width: 140, hozAlign: "center" },
    { title: "操作", field: "ops", width: 160, hozAlign: "center", headerSort: false,
      formatter: function(cell) {
        var id = cell.getRow().getData().id;
        return '<button class="op-edit" data-qid="' + id + '">编辑</button>'
               + '<button class="op-del" data-qid="' + id + '">删除</button>';
      }
    },
    { title: "选中", field: "sel", width: 60, hozAlign: "center",
      formatter: "rowSelection", titleFormatter: "rowSelection",
      headerSort: false, resizable: false }
  ];

  window._table = new Tabulator("#question-table", {
    columns: columns,
    layout: "fitDataFill",
    height: "100%",
    selectable: true,
    selectableRangeMode: "click",
    selectableRangeColumns: true,
    selectableRangeRows: true,
    rowHeight: 44,
    headerVisible: true,
    movableColumns: true
  });

  // Delegate button clicks
  document.getElementById('question-table').addEventListener('click', function(e) {
    var t = e.target; var qid = parseInt(t.getAttribute('data-qid'));
    if (!qid) return;
    if (t.classList.contains('star-btn')) {
      pyCall('toggle_star', qid);
    } else if (t.classList.contains('ans-expand')) {
      pyCall('expand_answer', qid);
    } else if (t.classList.contains('ans-collapse')) {
      pyCall('collapse_answer', qid);
    } else if (t.classList.contains('op-edit')) {
      pyCall('edit_question', qid);
    } else if (t.classList.contains('op-del')) {
      if (confirm('确定删除？')) pyCall('delete_question', qid);
    } else if (t.classList.contains('tag-chip')) {
      pyCall('edit_tag', parseInt(t.getAttribute('data-tag-id')));
    }
  });

  // Selection tracking
  window._table.on("rangeChanged", function() {
    var ids = window._table.getSelectedData().map(function(r){return r.id;});
    pyCall('selection_changed', JSON.stringify(ids));
  });

  // Right-click context
  window._table.on("rowContext", function(e, row) {
    e.preventDefault();
    pyCall('row_context', row.getData().id);
  });

  // ESC clears selection
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.activeElement.tagName !== 'INPUT') {
      window._table.deselectRow();
      pyCall('selection_cleared');
    }
  });
}

// ===== Python↔JS Bridge (URL interception, no QWebChannel needed) =====
function pyCall(action, data) {
  // Encode data safely
  var payload = encodeURIComponent(JSON.stringify({a: action, d: data}));
  window.location.href = 'py://call/' + payload;
}

// Receive from Python
function loadData(jsonStr) {
  if (!TABULATOR_LOADED) { setTimeout(function(){loadData(jsonStr);}, 200); return; }
  var data = JSON.parse(jsonStr);
  window._table.setData(data).then(function(){
    window._table.redraw(true);
  });
}
function setFontScale(pct) {
  document.getElementById('question-table').style.fontSize = Math.round(14*pct/100) + 'px';
}
function setImageMode(mode) {
  if (window._table) {
    var rows = window._table.getRows();
    rows.forEach(function(row){ var d=row.getData(); d.img_mode=mode; row.update(d); });
  }
}
// Data for the bridge
window._bridgeData = null;
</script>

<script src="https://unpkg.com/tabulator-tables@5.6.1/dist/js/tabulator.min.js"
    onload="initTable()"
    onerror="document.getElementById('question-table').innerHTML='<h3>无法加载表格组件，请检查网络连接</h3>'">
</script>
<link href="https://unpkg.com/tabulator-tables@5.6.1/dist/css/tabulator.min.css" rel="stylesheet">
</body>
</html>
