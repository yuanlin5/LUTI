<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库管理</title>
<link href="https://unpkg.com/tabulator-tables@5.6.1/dist/css/tabulator.min.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Microsoft YaHei', '微软雅黑', sans-serif; background: #fff; overflow: hidden; }
  #question-table { height: 100vh; width: 100%; }
  /* 选中高亮 */
  .tabulator-selected { background-color: #D2E3FC !important; }
  .tabulator-row.tabulator-selected { background-color: #D2E3FC !important; }
  /* 自动换行 */
  .tabulator-cell { white-space: normal !important; word-wrap: break-word !important; }
  .tabulator-row { min-height: 40px; }
  /* 星标 */
  .star-btn { cursor: pointer; font-size: 18px; border: none; background: none; padding: 2px 6px; border-radius: 50%; }
  .star-btn.active { color: #F5A623; }
  .star-btn.inactive { color: #BBB; }
  /* 标签 */
  .tag-chip { display: inline-block; color: #fff; border-radius: 10px; padding: 2px 10px; font-size: 12px; font-weight: bold; margin: 1px 2px; cursor: pointer; }
  /* 答案按钮 */
  .ans-btn { background: #D0D0D0; color: #666; border: none; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  /* 操作按钮 */
  .op-edit { background: #E8E8E8; color: #333; border: 1px solid #CCC; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px; margin-right: 4px; }
  .op-del { background: #FFE8E8; color: #C00; border: 1px solid #FFB0B0; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  /* 展开答案 */
  .answer-expanded { white-space: normal !important; word-wrap: break-word !important; }
  .answer-img { max-width: 100%; }
</style>
</head>
<body>
<div id="question-table"></div>

<script src="https://unpkg.com/tabulator-tables@5.6.1/dist/js/tabulator.min.js"></script>
<script>
// ===== QWebChannel Bridge =====
var bridge = null;
new QWebChannel(qt.webChannelTransport, function(channel) {
    bridge = channel.objects.bridge;
});

// ===== Callback helpers =====
var _cbCounter = 0;
var _callbacks = {};
function callPython(method, args, callback) {
    var id = 'cb' + (++_cbCounter);
    _callbacks[id] = callback || function(){};
    bridge.call(method, JSON.stringify({id: id, args: args}));
}
bridge.result = function(id, data) {
    if (_callbacks[id]) { _callbacks[id](JSON.parse(data)); delete _callbacks[id]; }
};

// ===== Column definitions =====
var columns = [
    { title: "选中", field: "sel", width: 60, hozAlign: "center",
      formatter: "rowSelection", titleFormatter: "rowSelection",
      headerSort: false, resizable: false, frozen: false },
    { title: "序号", field: "idx", width: 70, hozAlign: "center", headerSort: false },
    { title: "初始编号", field: "uid", width: 140, hozAlign: "center", visible: false },
    { title: "星标", field: "starred", width: 55, hozAlign: "center", headerSort: true,
      formatter: function(cell) {
          var v = cell.getValue();
          var cls = v ? 'active' : 'inactive';
          var sym = v ? '★' : '☆';
          return '<button class="star-btn ' + cls + '" data-qid="'
                 + cell.getRow().getData().id + '">' + sym + '</button>';
      }},
    { title: "题目", field: "question", width: 500,
      formatter: function(cell) {
          var d = cell.getRow().getData();
          var h = '';
          if (d.q_img) {
              h += '<img src="file:///' + d.q_img.replace(/\\/g,'/') + '" style="max-width:100%;'
                   + (d.img_mode === 'full' ? '' : 'max-height:50px;') + '"><br>';
          }
          h += '<span>' + (d.question || '') + '</span>';
          return h;
      }},
    { title: "分类", field: "cat", width: 100 },
    { title: "标签", field: "tags", width: 150,
      formatter: function(cell) {
          var tags = cell.getValue() || [];
          return tags.map(function(t) {
              return '<span class="tag-chip" style="background:' + t.color
                     + '" data-tag-id="' + t.id + '">' + t.name + '</span>';
          }).join('');
      }},
    { title: "答案", field: "answer", width: 200,
      formatter: function(cell) {
          var d = cell.getRow().getData();
          if (d.ans_expanded) {
              var h = '';
              if (d.a_img) h += '<img src="file:///' + d.a_img.replace(/\\/g,'/')
                               + '" class="answer-img"><br>';
              h += '<span>' + (d.answer || '') + '</span>';
              h += '<br><button class="ans-btn ans-collapse" data-qid="' + d.id + '">收起答案</button>';
              return h;
          }
          return '<button class="ans-btn ans-expand" data-qid="' + d.id + '">点击查看答案</button>';
      }},
    { title: "备注", field: "notes", width: 120, visible: false },
    { title: "错次", field: "wrong_count", width: 60, hozAlign: "center",
      formatter: function(cell) {
          var v = cell.getValue() || 0;
          return v > 0 ? '<span style="color:red">' + v + '</span>' : '0';
      }},
    { title: "最近修改", field: "updated_at", width: 140, hozAlign: "center",
      formatter: function(cell) {
          var v = cell.getValue() || '';
          return v.length > 16 ? v.substr(0,10).replace(/-/g,'/') + ' ' + v.substr(11,8) : (v || '-');
      }},
    { title: "操作", field: "ops", width: 160, hozAlign: "center", headerSort: false,
      formatter: function(cell) {
          var id = cell.getRow().getData().id;
          return '<button class="op-edit" data-qid="' + id + '">编辑</button>'
                 + '<button class="op-del" data-qid="' + id + '">删除</button>';
      }}
];

// ===== Init table =====
var table = new Tabulator("#question-table", {
    columns: columns,
    layout: "fitDataFill",
    height: "100%",
    selectable: true,
    selectableRangeMode: "click",
    selectableRangeColumns: true,
    selectableRangeRows: true,
    selectableRangeClearCells: false,
    selectableRangeAutoFocus: false,
    rowHeight: 44,
    headerVisible: true,
    movableColumns: true,
    resizableColumnFit: true
});

// ===== Event delegation for buttons =====
document.getElementById('question-table').addEventListener('click', function(e) {
    var target = e.target;
    var qid = parseInt(target.getAttribute('data-qid'));
    if (!qid) return;

    if (target.classList.contains('star-btn')) {
        bridge.toggle_star(qid, function(result) {});
        var row = table.getRow(qid);
        if (row) {
            var data = row.getData();
            data.starred = data.starred ? 0 : 1;
            row.update(data);
        }
    }
    else if (target.classList.contains('ans-expand')) {
        var row = table.getRow(qid);
        if (row) {
            var data = row.getData();
            data.ans_expanded = true;
            row.update(data);
        }
    }
    else if (target.classList.contains('ans-collapse')) {
        var row = table.getRow(qid);
        if (row) {
            var data = row.getData();
            data.ans_expanded = false;
            row.update(data);
        }
    }
    else if (target.classList.contains('op-edit')) {
        bridge.edit_question(qid);
    }
    else if (target.classList.contains('op-del')) {
        if (confirm('确定要删除这道题目吗？此操作不可恢复。')) {
            bridge.delete_question(qid);
        }
    }
    else if (target.classList.contains('tag-chip')) {
        var tagId = parseInt(target.getAttribute('data-tag-id'));
        bridge.edit_tag(tagId);
    }
});

// ===== Context menu =====
table.on("rowContext", function(e, row) {
    e.preventDefault();
    // 右键菜单由 Python 侧处理
    bridge.row_context(row.getData().id, e.clientX, e.clientY);
});

// ===== Selection tracking =====
table.on("rangeChanged", function() {
    var selected = table.getSelectedData();
    bridge.selection_changed(JSON.stringify(selected.map(function(r) { return r.id; })));
});

// ===== Keyboard shortcuts (handled by Tabulator + custom) =====
document.addEventListener('keydown', function(e) {
    // Let Tabulator handle its own shortcuts
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    // ESC → clear selection
    if (e.key === 'Escape') {
        table.deselectRow();
        bridge.selection_cleared();
    }
});

// ===== Exposed API for Python =====
function loadData(dataStr) {
    var data = JSON.parse(dataStr);
    table.setData(data);
}
function setImageMode(mode) {
    // update all rows with img_mode
    var rows = table.getRows();
    rows.forEach(function(row) {
        var d = row.getData();
        d.img_mode = mode;
        row.update(d);
    });
}
function setFontScale(percent) {
    var size = Math.round(14 * percent / 100);
    document.getElementById('question-table').style.fontSize = size + 'px';
}
function clearTable() {
    table.clearData();
}
function getSelectedIds() {
    var rows = table.getSelectedRows();
    return rows.map(function(r) { return r.getData().id; });
}
</script>
</body>
</html>
